<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shalm Platform</title>
    <style>
        :root {
            --bg:             #f1f5f9;
            --surface:        #ffffff;
            --surface-2:      #f8fafc;
            --border:         #e2e8f0;
            --border-2:       #cbd5e1;
            --text:           #1e293b;
            --muted:          #64748b;
            --primary:        #0284c7;
            --primary-hover:  #0369a1;
            --primary-light:  #e0f2fe;
            --danger:         #dc2626;
            --danger-hover:   #b91c1c;
            --danger-light:   #fef2f2;
            --success-bg:     #f0fdf4;
            --success-border: #bbf7d0;
            --success-text:   #166534;
            --error-bg:       #fef2f2;
            --error-border:   #fecaca;
            --error-text:     #991b1b;
            --warning-bg:     #fef3c7;
            --warning-border: #fcd34d;
            --warning-text:   #92400e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        a { color: var(--primary); }
        :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

        /* ── Header ── */
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0.9rem 2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        header h1 { font-size: 1.15rem; font-weight: 700; color: var(--text); }
        header .tagline { font-size: 0.8rem; color: var(--muted); }
        .header-actions { margin-left: auto; display: flex; align-items: center; gap: 0.9rem; }
        .link-muted { font-size: 0.8rem; color: var(--muted); text-decoration: none; font-weight: 600; }
        .link-muted:hover { color: var(--primary); }

        main { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }

        .page-heading { margin-bottom: 1.5rem; }
        .page-heading h2 { font-size: 1.4rem; font-weight: 700; color: var(--text); margin-bottom: 0.3rem; }
        .page-heading p { font-size: 0.875rem; color: var(--muted); }

        /* ── Alerts ── */
        .alert {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.25rem;
            font-size: 0.875rem;
            border: 1px solid;
        }
        .alert-success { background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); }
        .alert-error   { background: var(--error-bg);   border-color: var(--error-border);   color: var(--error-text); }
        .alert-warning { background: var(--warning-bg); border-color: var(--warning-border); color: var(--warning-text); }

        /* ── Tabs ── */
        .tabs {
            display: flex;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 1.5rem;
            gap: 4px;
        }
        .tab-btn {
            flex: 1;
            padding: 0.5rem 0.75rem;
            border: none;
            background: transparent;
            border-radius: 7px;
            color: var(--muted);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.12s, color 0.12s;
        }
        .tab-btn:hover:not(.active) { background: var(--surface-2); color: var(--text); }
        .tab-btn.active { background: var(--primary); color: #fff; font-weight: 600; }

        .tab-content { display: none; }
        .tab-content.visible { display: block; }

        /* ── Subtabs (Ledger / Operations) ── */
        .subtabs {
            display: flex;
            gap: 4px;
            margin-bottom: 1.25rem;
            border-bottom: 2px solid var(--border);
        }
        .subtab-btn {
            padding: 0.5rem 1rem;
            border: none;
            background: transparent;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }
        .subtab-btn:hover:not(.active) { color: var(--text); }
        .subtab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        .subtab-content { display: none; }
        .subtab-content.visible { display: block; }

        /* ── Section label ── */
        .section-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            margin-bottom: 0.75rem;
        }

        /* ── Stat cards (Dashboard) ── */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem 1.25rem;
        }
        .stat-card .stat-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin-bottom: 0.4rem;
        }
        .stat-card .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--text); }
        .stat-card .stat-sub { font-size: 0.75rem; color: var(--muted); margin-top: 0.2rem; }

        /* ── Bank / Account cards ── */
        .banks { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 0; }
        .bank-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        .bank-header {
            background: var(--surface-2);
            border-bottom: 1px solid var(--border);
            padding: 0.65rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .bank-name { font-size: 0.95rem; font-weight: 700; color: var(--text); }
        .org-tag {
            font-size: 0.68rem;
            background: var(--primary-light);
            color: var(--primary);
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-weight: 600;
        }
        .account-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1.25rem;
            border-bottom: 1px solid var(--border);
        }
        .account-row:last-child { border-bottom: none; }
        .account-info .client { font-size: 0.9rem; font-weight: 600; color: var(--text); }
        .account-info .acc-id { font-size: 0.72rem; font-family: monospace; color: var(--muted); }
        .account-balance { text-align: right; }
        .account-balance .amount { font-size: 1.35rem; font-weight: 700; color: var(--primary); }
        .account-balance .unit { font-size: 0.7rem; color: var(--muted); }

        /* ── Card ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 1.25rem;
        }
        .card h2 {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            margin-bottom: 1.25rem;
        }
        .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
        .card-head h2 { margin-bottom: 0; }

        /* ── Forms ── */
        .form-row { display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap; }
        .form-group { display: flex; flex-direction: column; gap: 0.35rem; flex: 1; min-width: 130px; }
        .form-group label { font-size: 0.75rem; font-weight: 500; color: var(--muted); }
        .form-group .hint { font-size: 0.72rem; color: var(--muted); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }

        input[type=text], input[type=number], input[type=search], select {
            background: var(--surface);
            border: 1px solid var(--border-2);
            border-radius: 6px;
            color: var(--text);
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            width: 100%;
            transition: border-color 0.12s;
        }
        input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
        input::placeholder { color: var(--muted); opacity: 0.7; }

        .btn {
            border: none;
            border-radius: 6px;
            padding: 0.55rem 1.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.12s;
        }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
        .btn-danger  { background: var(--danger);  color: #fff; }
        .btn-danger:hover:not(:disabled)  { background: var(--danger-hover); }
        .btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border-2); }
        .btn-secondary:hover:not(:disabled) { background: var(--border); }
        .btn-small { padding: 0.3rem 0.7rem; font-size: 0.78rem; }

        /* ── Manage grid ── */
        .manage-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }

        /* ── Warning note ── */
        .note {
            font-size: 0.78rem;
            color: var(--muted);
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.5rem 0.75rem;
            margin-bottom: 1rem;
        }

        /* ── Table ── */
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        thead th {
            text-align: left;
            color: var(--muted);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.5rem 0.75rem;
            border-bottom: 2px solid var(--border);
        }
        tbody td { padding: 0.65rem 0.75rem; border-bottom: 1px solid var(--border); color: var(--text); }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr.clickable { cursor: pointer; }
        tbody tr.clickable:hover td { background: var(--surface-2); }
        tbody tr.detail-row { display: none; }
        tbody tr.detail-row.visible { display: table-row; }
        tbody tr.detail-row td { background: var(--surface-2); padding: 1rem 1.25rem; }

        .badge {
            display: inline-block;
            padding: 0.2rem 0.55rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .badge-success { background: #dcfce7; color: #166534; }
        .badge-failed  { background: #fee2e2; color: #991b1b; }
        .badge-invalid { background: #f1f5f9; color: #64748b; }
        .badge-warning { background: var(--warning-bg); color: var(--warning-text); }

        .tx-id { font-family: monospace; font-size: 0.72rem; color: var(--muted); }
        .sub { font-size: 0.7rem; font-family: monospace; color: var(--muted); }
        .empty { color: var(--muted); font-size: 0.875rem; text-align: center; padding: 2rem 0; }

        /* ── Ledger-specific ── */
        .fabric-na { color: var(--muted); font-style: italic; }
        .ledger-amount { font-weight: 600; color: var(--primary); }

        /* ── Sync button ── */
        .btn-sync {
            background: var(--primary-light);
            color: var(--primary);
            border: 1px solid var(--primary);
            border-radius: 6px;
            padding: 0.4rem 1rem;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
            transition: background 0.12s, color 0.12s;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }
        .btn-sync:hover { background: var(--primary); color: #fff; }

        /* ── Copy button ── */
        .copy-btn {
            border: 1px solid var(--border-2);
            background: var(--surface);
            border-radius: 4px;
            padding: 0.1rem 0.4rem;
            font-size: 0.68rem;
            color: var(--muted);
            cursor: pointer;
            margin-left: 0.35rem;
        }
        .copy-btn:hover { color: var(--primary); border-color: var(--primary); }
        .hash { font-family: monospace; font-size: 0.75rem; }

        /* ── Search / filter bar ── */
        .toolbar { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: flex-end; margin-bottom: 1.25rem; }
        .toolbar .form-group { min-width: 160px; flex: 0 1 220px; }

        /* ── Network grid ── */
        .network-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
        .network-item { border: 1px solid var(--border); border-radius: 8px; padding: 0.85rem 1rem; }
        .network-item .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 0.3rem; }
        .network-item .value { font-size: 0.9rem; font-weight: 600; color: var(--text); }

        /* ── Modal ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 1rem;
        }
        .modal-overlay.visible { display: flex; }
        .modal-box {
            background: var(--surface);
            border-radius: 12px;
            padding: 1.5rem;
            max-width: 480px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-box h2 { margin-bottom: 1.25rem; }

        .action-links { display: flex; gap: 0.6rem; }
        .action-links button { background: none; border: none; color: var(--primary); font-size: 0.78rem; font-weight: 600; cursor: pointer; padding: 0; }
        .action-links button:hover { text-decoration: underline; }
        .action-links button.danger-link { color: var(--danger); }

        @media (max-width: 640px) {
            .banks, .manage-grid { grid-template-columns: 1fr; }
            .form-grid { grid-template-columns: 1fr; }
            table.responsive-cards thead { display: none; }
            table.responsive-cards, table.responsive-cards tbody, table.responsive-cards tr, table.responsive-cards td { display: block; width: 100%; }
            table.responsive-cards tr:not(.detail-row) { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 0.75rem; padding: 0.5rem 0.75rem; }
            table.responsive-cards td { border-bottom: none; padding: 0.3rem 0; }
            table.responsive-cards td[data-label]::before { content: attr(data-label); display: block; font-size: 0.65rem; text-transform: uppercase; color: var(--muted); font-weight: 700; }
        }
    </style>
</head>
<body>

<header>
    <h1>Shalm</h1>
    <span class="tagline">Cross-Bank Transfer Platform</span>
    <div class="header-actions">
        <a href="/architecture" class="link-muted">Architecture</a>
        <a href="/" class="btn-sync">&#8635; Sync with API</a>
    </div>
</header>

<main>

    {#if message}
    <div class="alert alert-success" role="status">{message}</div>
    {/if}
    {#if error}
    <div class="alert alert-error" role="alert">{error}</div>
    {/if}

    <!-- Top-level Tab Navigation -->
    <nav class="tabs" aria-label="Primary">
        <button class="tab-btn" data-tab="dashboard"  onclick="showTab('dashboard')">Dashboard</button>
        <button class="tab-btn" data-tab="accounts"   onclick="showTab('accounts')">Accounts</button>
        <button class="tab-btn" data-tab="transfer"   onclick="showTab('transfer')">Transfer</button>
        <button class="tab-btn" data-tab="ledger"     onclick="showTab('ledger')">Ledger</button>
        <button class="tab-btn" data-tab="operations" onclick="showTab('operations')">Operations</button>
    </nav>

    {#include tabs/dashboard /}
    {#include tabs/accounts /}
    {#include tabs/transfer /}
    {#include tabs/ledger /}
    {#include tabs/operations /}

</main>

<script>
    function showTab(name) {
        document.querySelectorAll('.tab-content').forEach(function(el) { el.classList.remove('visible'); });
        document.querySelectorAll('.tab-btn').forEach(function(el) { el.classList.remove('active'); });
        var content = document.getElementById('tab-' + name);
        if (content) content.classList.add('visible');
        var btn = document.querySelector('.tab-btn[data-tab="' + name + '"]');
        if (btn) btn.classList.add('active');
    }

    function showSubTab(group, name) {
        document.querySelectorAll('.subtab-content[data-group="' + group + '"]').forEach(function(el) { el.classList.remove('visible'); });
        document.querySelectorAll('.subtab-btn[data-group="' + group + '"]').forEach(function(el) { el.classList.remove('active'); });
        var content = document.getElementById('subtab-' + group + '-' + name);
        if (content) content.classList.add('visible');
        var btn = document.querySelector('.subtab-btn[data-group="' + group + '"][data-name="' + name + '"]');
        if (btn) btn.classList.add('active');
    }

    function toggleDetail(id) {
        var row = document.getElementById(id);
        if (row) row.classList.toggle('visible');
    }

    function openModal(id) {
        var el = document.getElementById(id);
        if (el) el.classList.add('visible');
    }

    function closeModal(id) {
        var el = document.getElementById(id);
        if (el) el.classList.remove('visible');
    }

    function disableSubmit(form) {
        var btn = form.querySelector('button[type=submit]');
        if (btn) {
            btn.disabled = true;
            btn.dataset.originalText = btn.textContent;
            btn.textContent = 'Submitting…';
        }
        return true;
    }

    function copyText(text, btn) {
        if (navigator.clipboard) {
            navigator.clipboard.writeText(text);
        }
        if (btn) {
            var original = btn.textContent;
            btn.textContent = 'Copied';
            setTimeout(function() { btn.textContent = original; }, 1200);
        }
    }

    function filterAccounts() {
        var q = document.getElementById('acc-search').value.trim().toLowerCase();
        var org = document.getElementById('acc-org-filter').value;
        document.querySelectorAll('#accounts-table tbody tr.account-data-row').forEach(function(row) {
            var matchesQuery = !q || row.dataset.id.toLowerCase().indexOf(q) !== -1 || row.dataset.owner.toLowerCase().indexOf(q) !== -1;
            var matchesOrg = !org || row.dataset.bank === org;
            var visible = matchesQuery && matchesOrg;
            row.style.display = visible ? '' : 'none';
            var detail = document.getElementById('detail-' + row.dataset.id);
            if (detail && !visible) detail.classList.remove('visible');
        });
    }

    function sortAccounts() {
        var key = document.getElementById('acc-sort').value;
        var tbody = document.querySelector('#accounts-table tbody');
        var rows = Array.from(tbody.querySelectorAll('tr.account-data-row'));
        rows.sort(function(a, b) {
            if (key === 'balance') return Number(b.dataset.balance) - Number(a.dataset.balance);
            if (key === 'updated') return (b.dataset.updated || '').localeCompare(a.dataset.updated || '');
            return (a.dataset.owner || '').localeCompare(b.dataset.owner || '');
        });
        rows.forEach(function(row) {
            var detail = document.getElementById('detail-' + row.dataset.id);
            tbody.appendChild(row);
            if (detail) tbody.appendChild(detail);
        });
    }

    function formatLocalTimes() {
        document.querySelectorAll('.local-time[data-iso]').forEach(function(el) {
            var iso = el.dataset.iso;
            if (!iso) return;
            var d = new Date(iso);
            if (!isNaN(d.getTime())) {
                el.textContent = d.toLocaleString();
                el.title = iso;
            }
        });
    }

    showTab('{activeTab}');
    showSubTab('ledger', '{ledgerSubTab}');
    showSubTab('operations', '{opsSubTab}');
    formatLocalTimes();
</script>

</body>
</html>
