quarkus.application.name=quarkus-api
quarkus.http.port=8080

# JSON logging to stdout (consumed by Promtail)
quarkus.log.console.json=true

# Health endpoint
quarkus.smallrye-health.root-path=/health

# Prometheus metrics endpoint
quarkus.micrometer.export.prometheus.path=/metrics

# Fabric Gateway — one signer and peer connection per organization.
# Disabled by default; enable in prod via FABRIC_ENABLED=true.
fabric.enabled=${FABRIC_ENABLED:false}
fabric.org1.peer.host=${FABRIC_ORG1_PEER_HOST:peer0-org1.fabric.svc.cluster.local}
fabric.org1.peer.port=${FABRIC_ORG1_PEER_PORT:7051}
fabric.org1.msp.id=${FABRIC_ORG1_MSP_ID:Org1MSP}
fabric.org1.cert.path=${FABRIC_ORG1_CERT_PATH:/fabric-crypto/org1/admin-cert.pem}
fabric.org1.key.path=${FABRIC_ORG1_KEY_PATH:/fabric-crypto/org1/admin-key.pem}
fabric.org2.peer.host=${FABRIC_ORG2_PEER_HOST:peer0-org2.fabric.svc.cluster.local}
fabric.org2.peer.port=${FABRIC_ORG2_PEER_PORT:7051}
fabric.org2.msp.id=${FABRIC_ORG2_MSP_ID:Org2MSP}
fabric.org2.cert.path=${FABRIC_ORG2_CERT_PATH:/fabric-crypto/org2/admin-cert.pem}
fabric.org2.key.path=${FABRIC_ORG2_KEY_PATH:/fabric-crypto/org2/admin-key.pem}
fabric.orderer.host=${FABRIC_ORDERER_HOST:orderer.fabric.svc.cluster.local}
fabric.orderer.port=${FABRIC_ORDERER_PORT:7050}
fabric.orderer.operations.port=${FABRIC_ORDERER_OPERATIONS_PORT:8443}
fabric.channel=${FABRIC_CHANNEL:mychannel}
fabric.chaincode=${FABRIC_CHAINCODE:bank-transfer}
fabric.chaincode.version=${FABRIC_CHAINCODE_VERSION:unknown}
fabric.health.account=${FABRIC_HEALTH_ACCOUNT:ACC-B1-001}
