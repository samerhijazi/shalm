quarkus.application.name=quarkus-api
quarkus.http.port=8080

# JSON logging to stdout (consumed by Promtail)
quarkus.log.console.json=true

# Health endpoint
quarkus.smallrye-health.root-path=/health

# Prometheus metrics endpoint
quarkus.micrometer.export.prometheus.path=/metrics

# Fabric Gateway — disabled by default; enable in prod via FABRIC_ENABLED=true
fabric.enabled=${FABRIC_ENABLED:false}
fabric.peer.host=${FABRIC_PEER_HOST:peer0-org1.fabric.svc.cluster.local}
fabric.peer.port=${FABRIC_PEER_PORT:7051}
fabric.msp.id=${FABRIC_MSP_ID:Org1MSP}
fabric.channel=${FABRIC_CHANNEL:mychannel}
fabric.chaincode=${FABRIC_CHAINCODE:bank-transfer}
fabric.cert.path=${FABRIC_CERT_PATH:/fabric-crypto/admin-cert.pem}
fabric.key.path=${FABRIC_KEY_PATH:/fabric-crypto/admin-key.pem}
