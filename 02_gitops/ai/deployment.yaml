apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-observability-agent
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-observability-agent
  template:
    metadata:
      labels:
        app: ai-observability-agent
    spec:
      containers:
        - name: ai-observability-agent
          image: ghcr.io/samerhijazi/shalm-ai-agent:adf6f7f5c698c463c7517735e7f753c281656326
          ports:
            - containerPort: 8000
          env:
            - name: LOKI_URL
              value: "http://loki.observability.svc.cluster.local:3100"
            - name: PROMETHEUS_URL
              value: "http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
