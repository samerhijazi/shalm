apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-pod-health
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  pod-health.json: |
    {
      "uid": "shalm-pod-health",
      "title": "Pod Health",
      "tags": ["pods", "shalm"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "label": "Datasource"
          },
          {
            "name": "namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "${datasource}" },
            "query": "label_values(kube_pod_info, namespace)",
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "current": {},
            "label": "Namespace"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Pods Running",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "count(kube_pod_status_phase{phase='Running', namespace=~'$namespace'})",
              "legendFormat": "Running",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null }
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Pods Pending",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "count(kube_pod_status_phase{phase='Pending', namespace=~'$namespace'}) or vector(0)",
              "legendFormat": "Pending",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Pods Failed",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "count(kube_pod_status_phase{phase='Failed', namespace=~'$namespace'}) or vector(0)",
              "legendFormat": "Failed",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Container Restarts (1h)",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=~'$namespace'}[1h]))",
              "legendFormat": "Restarts",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              }
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Pod CPU Usage (cores)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum by(pod, namespace) (rate(container_cpu_usage_seconds_total{container!='', namespace=~'$namespace'}[5m]))",
              "legendFormat": "{{namespace}}/{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short" }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Pod Memory Usage (bytes)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum by(pod, namespace) (container_memory_working_set_bytes{container!='', namespace=~'$namespace'})",
              "legendFormat": "{{namespace}}/{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "bytes" }
          }
        },
        {
          "id": 7,
          "type": "table",
          "title": "Pod Restart Count (total)",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sort_desc(sum by(namespace, pod, container) (kube_pod_container_status_restarts_total{namespace=~'$namespace'}))",
              "legendFormat": "{{namespace}} / {{pod}} / {{container}}",
              "refId": "A",
              "instant": true
            }
          ],
          "transformations": [
            { "id": "labelsToFields", "options": {} },
            { "id": "organize", "options": { "renameByName": { "Value": "Restarts" } } }
          ]
        }
      ]
    }
