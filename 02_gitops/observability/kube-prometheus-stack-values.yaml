# kube-prometheus-stack Helm values
# Chart: prometheus-community/kube-prometheus-stack

grafana:
  adminPassword: "shalm-admin"
  service:
    type: NodePort
    nodePort: 30300
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.observability.svc.cluster.local:3100
      access: proxy
      isDefault: false

prometheus:
  service:
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    retention: 7d
    # No PVC — use emptyDir (no StorageClass configured on this cluster)
    storageSpec: {}
    # Scrape ServiceMonitors and PodMonitors from ALL namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}

alertmanager:
  service:
    type: NodePort
    nodePort: 30093
  alertmanagerSpec:
    storage: {}

# Disable components not needed for this cluster size
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
