apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pod-health-alerts
  namespace: observability
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: pod.health
      interval: 30s
      rules:
        - alert: PodNotReady
          expr: |
            kube_pod_status_ready{
              condition="true",
              namespace=~"quarkus-api|quarkus-ui|fabric|observability"
            } == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} not ready in {{ $labels.namespace }}"
            description: "Pod has been in a not-ready state for more than 2 minutes."

        - alert: PodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{
              namespace=~"quarkus-api|quarkus-ui|fabric"
            }[15m]) * 60 * 15 > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} is crash-looping in {{ $labels.namespace }}"
            description: "Container {{ $labels.container }} has restarted more than 3 times in 15 minutes."

        - alert: DeploymentReplicasMismatch
          expr: |
            kube_deployment_spec_replicas{
              namespace=~"quarkus-api|quarkus-ui|fabric"
            }
              !=
            kube_deployment_status_replicas_available{
              namespace=~"quarkus-api|quarkus-ui|fabric"
            }
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Deployment {{ $labels.deployment }} replica count mismatch in {{ $labels.namespace }}"
            description: "Desired vs available replicas differ for more than 5 minutes."
