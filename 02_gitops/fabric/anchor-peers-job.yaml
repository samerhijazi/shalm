apiVersion: batch/v1
kind: Job
metadata:
  name: fabric-anchor-peers
  namespace: fabric
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 3
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-orderer
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z orderer.fabric.svc.cluster.local 7050; do
                echo "Waiting for orderer..."; sleep 5
              done
        - name: wait-peer-org1
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z peer0-org1.fabric.svc.cluster.local 7051; do
                echo "Waiting for peer0-org1..."; sleep 5
              done
        - name: wait-peer-org2
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z peer0-org2.fabric.svc.cluster.local 7051; do
                echo "Waiting for peer0-org2..."; sleep 5
              done
      containers:
        - name: anchor-peers
          image: hyperledger/fabric-tools:2.5
          env:
            - name: FABRIC_CFG_PATH
              value: /etc/hyperledger/fabric
          command:
            - bash
            - -c
            - |
              set -euo pipefail

              # ── why this job exists ──────────────────────────────────────────
              # Cross-org Fabric Gateway service discovery (used by
              # FabricGatewayService.transfer() for the real endorsement path)
              # requires each org's anchor peer to be set in the live channel
              # config -- without it, peer0-org1 has no way to learn peer0-org2
              # exists, and any Transfer submission fails with:
              #   "failed to find any endorsing peers for org(s): Org2MSP"
              # configtx.yaml declares AnchorPeers under each org, but channel
              # creation via `peer channel create -f mychannel.tx` does not
              # apply them automatically -- they must be submitted as a
              # separate channel config update, once per org, signed by that
              # org's own admin (AnchorPeers is scoped to each org's own
              # Admins policy, so no cross-org signature is required).

              update_anchor_peer() {
                local org_msp="$1" peer_host="$2" peer_port="$3" msp_path="$4"

                export CORE_PEER_ADDRESS="${peer_host}:${peer_port}"
                export CORE_PEER_LOCALMSPID="$org_msp"
                export CORE_PEER_MSPCONFIGPATH="$msp_path"
                export CORE_PEER_TLS_ENABLED=false

                echo "==> [$org_msp] Fetching current channel config..."
                peer channel fetch config "/tmp/${org_msp}_config_block.pb" \
                  -o orderer.fabric.svc.cluster.local:7050 \
                  -c mychannel --tls=false

                configtxlator proto_decode --input "/tmp/${org_msp}_config_block.pb" --type common.Block \
                  | jq .data.data[0].payload.data.config > "/tmp/${org_msp}_config.json"

                jq '.channel_group.groups.Application.groups.'"$org_msp"'.values += {"AnchorPeers":{"mod_policy":"Admins","value":{"anchor_peers":[{"host":"'"$peer_host"'","port":'"$peer_port"'}]},"version":"0"}}' \
                  "/tmp/${org_msp}_config.json" > "/tmp/${org_msp}_modified_config.json"

                if diff -q "/tmp/${org_msp}_config.json" "/tmp/${org_msp}_modified_config.json" > /dev/null; then
                  echo "==> [$org_msp] Anchor peer already set, skipping."
                  return 0
                fi

                configtxlator proto_encode --input "/tmp/${org_msp}_config.json" --type common.Config \
                  --output "/tmp/${org_msp}_config.pb"
                configtxlator proto_encode --input "/tmp/${org_msp}_modified_config.json" --type common.Config \
                  --output "/tmp/${org_msp}_modified_config.pb"
                configtxlator compute_update --channel_id mychannel \
                  --original "/tmp/${org_msp}_config.pb" --updated "/tmp/${org_msp}_modified_config.pb" \
                  --output "/tmp/${org_msp}_config_update.pb"

                configtxlator proto_decode --input "/tmp/${org_msp}_config_update.pb" --type common.ConfigUpdate \
                  | jq '{"payload":{"header":{"channel_header":{"channel_id":"mychannel","type":2}},"data":{"config_update":.}}}' \
                  > "/tmp/${org_msp}_config_update_envelope.json"
                configtxlator proto_encode --input "/tmp/${org_msp}_config_update_envelope.json" --type common.Envelope \
                  --output "/tmp/${org_msp}_config_update_envelope.pb"

                echo "==> [$org_msp] Submitting anchor peer update (host=$peer_host, port=$peer_port)..."
                peer channel update \
                  -f "/tmp/${org_msp}_config_update_envelope.pb" \
                  -c mychannel \
                  -o orderer.fabric.svc.cluster.local:7050 \
                  --tls=false
                echo "==> [$org_msp] Anchor peer set."
              }

              update_anchor_peer "Org1MSP" "peer0-org1.fabric.svc.cluster.local" 7051 "/org1-admin-msp"
              sleep 3
              update_anchor_peer "Org2MSP" "peer0-org2.fabric.svc.cluster.local" 7051 "/org2-admin-msp"

              echo ""
              echo "==> Anchor peer setup complete."
          volumeMounts:
            - name: org1-admin-msp
              mountPath: /org1-admin-msp
            - name: org1-admin-msp-cacerts
              mountPath: /org1-admin-msp/cacerts
            - name: org1-admin-msp-signcerts
              mountPath: /org1-admin-msp/signcerts
            - name: org1-admin-msp-keystore
              mountPath: /org1-admin-msp/keystore
            - name: org1-admin-msp-tlscacerts
              mountPath: /org1-admin-msp/tlscacerts
            - name: org2-admin-msp
              mountPath: /org2-admin-msp
            - name: org2-admin-msp-cacerts
              mountPath: /org2-admin-msp/cacerts
            - name: org2-admin-msp-signcerts
              mountPath: /org2-admin-msp/signcerts
            - name: org2-admin-msp-keystore
              mountPath: /org2-admin-msp/keystore
            - name: org2-admin-msp-tlscacerts
              mountPath: /org2-admin-msp/tlscacerts
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: org1-admin-msp
          secret:
            secretName: fabric-org1-admin-msp
        - name: org1-admin-msp-cacerts
          secret:
            secretName: fabric-org1-admin-msp-cacerts
        - name: org1-admin-msp-signcerts
          secret:
            secretName: fabric-org1-admin-msp-signcerts
        - name: org1-admin-msp-keystore
          secret:
            secretName: fabric-org1-admin-msp-keystore
        - name: org1-admin-msp-tlscacerts
          secret:
            secretName: fabric-org1-admin-msp-tlscacerts
        - name: org2-admin-msp
          secret:
            secretName: fabric-org2-admin-msp
        - name: org2-admin-msp-cacerts
          secret:
            secretName: fabric-org2-admin-msp-cacerts
        - name: org2-admin-msp-signcerts
          secret:
            secretName: fabric-org2-admin-msp-signcerts
        - name: org2-admin-msp-keystore
          secret:
            secretName: fabric-org2-admin-msp-keystore
        - name: org2-admin-msp-tlscacerts
          secret:
            secretName: fabric-org2-admin-msp-tlscacerts
