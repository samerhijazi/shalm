apiVersion: apps/v1
kind: Deployment
metadata:
  name: fabric-chaincode
  namespace: fabric
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fabric-chaincode
  template:
    metadata:
      labels:
        app: fabric-chaincode
      annotations:
        # Written by 04_blockchain/fabric/chaincode/update-release-config.sh. CORE_CHAINCODE_ID_NAME
        # is read from the ConfigMap only at pod start, so a new package ID must change the pod
        # template to roll the pod — otherwise it keeps serving the old ID and fabric-setup's
        # InitLedger hangs against the newly committed definition.
        shalm.io/chaincode-id: "bank-transfer_1.2:b5eb1da6327b91321097e20dde777dec319a3ce1a1d054f1a5086afe9638412a"
    spec:
      containers:
        - name: chaincode
          image: ghcr.io/samerhijazi/shalm-chaincode:aec8c96a7ea9fc01b16956600080ed984e359d92
          ports:
            - containerPort: 9999
          env:
            - name: CHAINCODE_SERVER_PORT
              value: "9999"
            - name: CORE_CHAINCODE_ID_NAME
              valueFrom:
                configMapKeyRef:
                  name: fabric-chaincode-config
                  key: chaincode-id
          readinessProbe:
            tcpSocket:
              port: 9999
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9999
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
