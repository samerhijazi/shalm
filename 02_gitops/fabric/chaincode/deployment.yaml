apiVersion: apps/v1
kind: Deployment
metadata:
  name: fabric-chaincode
  namespace: fabric
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fabric-chaincode
  template:
    metadata:
      labels:
        app: fabric-chaincode
    spec:
      containers:
        - name: chaincode
          image: ghcr.io/samerhijazi/shalm-chaincode:b25fe2eb2bc5a0a84e24e8ff1ad2fe3bfec01349
          ports:
            - containerPort: 9999
          env:
            - name: CHAINCODE_SERVER_PORT
              value: "9999"
            - name: CORE_CHAINCODE_ID_NAME
              valueFrom:
                configMapKeyRef:
                  name: fabric-chaincode-config
                  key: chaincode-id
          readinessProbe:
            tcpSocket:
              port: 9999
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9999
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
