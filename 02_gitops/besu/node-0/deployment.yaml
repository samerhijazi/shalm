apiVersion: apps/v1
kind: Deployment
metadata:
  name: besu-node-0
  namespace: besu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: besu-node-0
  template:
    metadata:
      labels:
        app: besu-node-0
        besu-node: "true"
    spec:
      initContainers:
        - name: init-static-nodes
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              IP0=$(getent hosts besu-node-0.besu.svc.cluster.local | awk '{print $1}')
              IP1=$(getent hosts besu-node-1.besu.svc.cluster.local | awk '{print $1}')
              IP2=$(getent hosts besu-node-2.besu.svc.cluster.local | awk '{print $1}')
              cat > /static-nodes/static-nodes.json <<EOF
              [
                "enode://09b02f8a5fddd222ade4ea4528faefc399623af3f736be3c44f03e2df22fb792f3931a4d9573d333ca74343305762a753388c3422a86d98b713fc91c1ea04842@${IP0}:30303",
                "enode://af80b90d25145da28c583359beb47b21796b2fe1a23c1511e443e7a64dfdb27d7434c380f0aa4c500e220aa1a9d068514b1ff4d5019e624e7ba1efe82b340a59@${IP1}:30303",
                "enode://ce7edc292d7b747fab2f23584bbafaffde5c8ff17cf689969614441e0527b90015ea9fee96aed6d9c0fc2fbe0bd1883dee223b3200246ff1e21976bdbc9a0fc8@${IP2}:30303"
              ]
              EOF
          volumeMounts:
            - name: static-nodes
              mountPath: /static-nodes
      containers:
        - name: besu
          image: hyperledger/besu:24.10.0
          command:
            - /opt/besu/bin/besu
            - --genesis-file=/config/genesis.json
            - --node-private-key-file=/secrets/key
            - --static-nodes-file=/static-nodes/static-nodes.json
            - --data-path=/data
            - --p2p-host=0.0.0.0
            - --p2p-port=30303
            - --rpc-http-enabled=true
            - --rpc-http-host=0.0.0.0
            - --rpc-http-port=8545
            - --rpc-http-api=ETH,NET,QBFT,ADMIN,TXPOOL
            - --rpc-http-cors-origins=*
            - --host-allowlist=*
            - --rpc-http-authentication-enabled=false
            - --metrics-enabled=true
            - --metrics-host=0.0.0.0
            - --metrics-port=9545
            - --logging=INFO
          ports:
            - name: p2p
              containerPort: 30303
              protocol: TCP
            - name: rpc-http
              containerPort: 8545
              protocol: TCP
            - name: metrics
              containerPort: 9545
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: key
              mountPath: /secrets
            - name: data
              mountPath: /data
            - name: static-nodes
              mountPath: /static-nodes
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /liveness
              port: 8545
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /liveness
              port: 8545
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: besu-config
        - name: key
          secret:
            secretName: besu-node-0-key
        - name: data
          emptyDir: {}
        - name: static-nodes
          emptyDir: {}
