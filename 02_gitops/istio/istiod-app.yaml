apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.io
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    targetRevision: 1.23.2
    chart: istiod
    helm:
      values: |
        pilot:
          autoscaleEnabled: false
          replicaCount: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
        meshConfig:
          accessLogFile: /dev/stdout
          defaultConfig:
            proxyMetadata: {}
          enablePrometheusMerge: true
          extensionProviders:
            - name: jaeger
              zipkin:
                service: jaeger.observability.svc.cluster.local
                port: 9411
                maxTagLength: 256
          defaultProviders:
            tracing:
              - jaeger
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
