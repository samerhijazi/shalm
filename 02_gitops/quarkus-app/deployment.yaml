apiVersion: apps/v1
kind: Deployment
metadata:
  name: quarkus-api
  namespace: quarkus-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quarkus-api
  template:
    metadata:
      labels:
        app: quarkus-api
    spec:
      containers:
        - name: quarkus-api
          image: ghcr.io/samerhijazi/quarkus-api:da91bcb8305cb33e23fe5bd21e64400bac4fbff1
          ports:
            - containerPort: 8080
          env:
            - name: QUARKUS_LOG_CONSOLE_JSON
              value: "true"
            # Enable after create-secrets.sh has copied both organization
            # identities into the quarkus-api namespace.
            - name: FABRIC_ENABLED
              value: "true"
            # Displayed on the Operations -> Network page. Keep in sync with
            # chaincode-version in 02_gitops/fabric/chaincode-config.yaml — that
            # ConfigMap lives in the fabric namespace and can't be mounted here
            # directly (ConfigMaps are namespace-scoped, same as the Fabric
            # identity secret, see CLAUDE.md Known Issues).
            - name: FABRIC_CHAINCODE_VERSION
              value: "1.2"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 7
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: fabric-org1-crypto
              mountPath: /fabric-crypto/org1
              readOnly: true
            - name: fabric-org2-crypto
              mountPath: /fabric-crypto/org2
              readOnly: true
      volumes:
        - name: fabric-org1-crypto
          secret:
            secretName: fabric-org1-admin
        - name: fabric-org2-crypto
          secret:
            secretName: fabric-org2-admin
