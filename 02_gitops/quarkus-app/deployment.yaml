apiVersion: apps/v1
kind: Deployment
metadata:
  name: quarkus-api
  namespace: quarkus-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quarkus-api
  template:
    metadata:
      labels:
        app: quarkus-api
    spec:
      containers:
        - name: quarkus-api
          image: ghcr.io/samerhijazi/quarkus-api:33257231f6b292540ea9151520d9c6f9d284759f
          ports:
            - containerPort: 8080
          env:
            - name: QUARKUS_LOG_CONSOLE_JSON
              value: "true"
            # Phase 4: set FABRIC_ENABLED=true after running create-secrets.sh
            # and patching in the fabric-org1-admin secret volume below.
            - name: FABRIC_ENABLED
              value: "true"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 7
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: fabric-crypto
              mountPath: /fabric-crypto
              readOnly: true
      volumes:
        - name: fabric-crypto
          secret:
            secretName: fabric-org1-admin
            optional: true
