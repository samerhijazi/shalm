apiVersion: apps/v1
kind: Deployment
metadata:
  name: quarkus-ui
  namespace: quarkus-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quarkus-ui
  template:
    metadata:
      labels:
        app: quarkus-ui
    spec:
      containers:
        - name: quarkus-ui
          image: ghcr.io/samerhijazi/quarkus-ui:604a29298ec5d6975d7a964aaab6d7475a14b533
          ports:
            - containerPort: 8080
          env:
            - name: QUARKUS_LOG_CONSOLE_JSON
              value: "true"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
