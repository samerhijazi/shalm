apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-observability-agent
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.io
spec:
  project: default
  source:
    repoURL: https://github.com/samerhijazi/shalm
    targetRevision: HEAD
    path: 02_gitops/ai
  destination:
    server: https://kubernetes.default.svc
    namespace: ai
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
