name: Fabric Chaincode CI

on:
  pull_request:
    paths:
      - "04_blockchain/fabric/chaincode/**"
      - "02_gitops/fabric/chaincode-config.yaml"
      - "02_gitops/fabric/setup-job.yaml"
      - "02_gitops/fabric/smoke-test-job.yaml"
      - ".github/workflows/chaincode.yml"
  push:
    branches: [main]
    paths:
      - "04_blockchain/fabric/chaincode/**"
      - "02_gitops/fabric/chaincode-config.yaml"
      - "02_gitops/fabric/setup-job.yaml"
      - "02_gitops/fabric/smoke-test-job.yaml"
      - ".github/workflows/chaincode.yml"
  workflow_dispatch:

env:
  FABRIC_TEST_VERSION: 2.5.16
  FABRIC_SAMPLES_COMMIT: 119d3bc
  IMAGE: ghcr.io/samerhijazi/shalm-chaincode
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Unit and release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Load versions
        run: grep -v '^#' versions.env | grep -v '^$' >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run chaincode unit tests
        run: mvn --batch-mode test
        working-directory: 04_blockchain/fabric/chaincode

      - name: Validate lifecycle metadata and package ID
        run: 04_blockchain/fabric/chaincode/validate-release.sh

  integration:
    name: Fabric CCAAS integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install pinned Fabric test network
        working-directory: /tmp
        run: |
          git clone --filter=blob:none https://github.com/hyperledger/fabric-samples.git
          git -C fabric-samples checkout "$FABRIC_SAMPLES_COMMIT"
          curl --fail --location --retry 5 --silent --show-error \
            --output install-fabric.sh \
            "https://raw.githubusercontent.com/hyperledger/fabric/v${FABRIC_TEST_VERSION}/scripts/install-fabric.sh"
          chmod +x install-fabric.sh
          ./install-fabric.sh --fabric-version "$FABRIC_TEST_VERSION" binary docker

      - name: Deploy and exercise Java CCAAS chaincode
        working-directory: /tmp/fabric-samples/test-network
        run: |
          set -euo pipefail
          trap './network.sh down' EXIT
          source "$GITHUB_WORKSPACE/04_blockchain/fabric/chaincode/release.env"

          ./network.sh up createChannel
          ./network.sh deployCCAAS \
            -ccn "$CHAINCODE_NAME" \
            -ccp "$GITHUB_WORKSPACE/04_blockchain/fabric/chaincode"

          docker pull busybox:1.37.0 >/dev/null

          wait_for_ccaas() {
            local container="$1"
            local state=""
            local logs=""

            for attempt in $(seq 1 60); do
              state="$(docker inspect --format '{{.State.Status}}' "$container" 2>/dev/null || true)"
              logs="$(docker logs "$container" 2>&1 || true)"

              if [ "$state" = "running" ] && docker run --rm \
                --network fabric_test \
                busybox:1.37.0 \
                nc -z -w 2 "$container" 9999 >/dev/null 2>&1; then
                echo "$container is ready"
                return 0
              fi
              if [ "$state" = "exited" ] || [ "$state" = "dead" ]; then
                echo "::error::$container stopped before becoming ready"
                printf '%s\n' "$logs"
                return 1
              fi

              echo "Waiting for $container (attempt $attempt/60)..."
              sleep 1
            done

            echo "::error::Timed out waiting for $container"
            printf '%s\n' "$logs"
            return 1
          }

          wait_for_ccaas peer0org1_${CHAINCODE_NAME}_ccaas
          wait_for_ccaas peer0org2_${CHAINCODE_NAME}_ccaas

          export CORE_PEER_TLS_ENABLED=true
          ORG1_TLS_ROOT="$PWD/organizations/peerOrganizations/org1.example.com/tlsca/tlsca.org1.example.com-cert.pem"
          ORG2_TLS_ROOT="$PWD/organizations/peerOrganizations/org2.example.com/tlsca/tlsca.org2.example.com-cert.pem"
          ORDERER_TLS_ROOT="$PWD/organizations/ordererOrganizations/example.com/orderers/orderer.example.com/msp/tlscacerts/tlsca.example.com-cert.pem"
          export CORE_PEER_LOCALMSPID=Org1MSP
          export CORE_PEER_TLS_ROOTCERT_FILE="$ORG1_TLS_ROOT"
          export CORE_PEER_MSPCONFIGPATH="$PWD/organizations/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp"
          export CORE_PEER_ADDRESS=localhost:7051
          export PATH="$PWD/../bin:$PATH"
          export FABRIC_CFG_PATH="$PWD/../config"

          ledger_initialized=false
          for attempt in 1 2 3 4 5; do
            if peer chaincode invoke \
              -o localhost:7050 \
              --ordererTLSHostnameOverride orderer.example.com \
              --tls \
              --cafile "$ORDERER_TLS_ROOT" \
              -C mychannel \
              -n "$CHAINCODE_NAME" \
              --peerAddresses localhost:7051 \
              --tlsRootCertFiles "$ORG1_TLS_ROOT" \
              --peerAddresses localhost:9051 \
              --tlsRootCertFiles "$ORG2_TLS_ROOT" \
              --waitForEvent \
              --waitForEventTimeout 30s \
              -c '{"function":"InitLedger","Args":[]}'; then
              ledger_initialized=true
              break
            fi
            echo "InitLedger invoke not ready (attempt $attempt/5); retrying..."
            sleep 3
          done
          test "$ledger_initialized" = "true"

          balance=""
          for attempt in 1 2 3 4 5 6; do
            balance="$(peer chaincode query \
              -C mychannel \
              -n "$CHAINCODE_NAME" \
              -c '{"function":"QueryBalance","Args":["ACC-B1-001"]}' 2>/dev/null || true)"
            [ "$balance" = "1000" ] && break
            echo "Balance not committed yet (attempt $attempt); retrying..."
            sleep 3
          done
          test "$balance" = "1000"

          echo "Testing authorized Org1MSP -> Org2MSP ownership transfer..."
          peer chaincode invoke \
            -o localhost:7050 \
            --ordererTLSHostnameOverride orderer.example.com \
            --tls \
            --cafile "$ORDERER_TLS_ROOT" \
            -C mychannel \
            -n "$CHAINCODE_NAME" \
            --peerAddresses localhost:7051 \
            --tlsRootCertFiles "$ORG1_TLS_ROOT" \
            --peerAddresses localhost:9051 \
            --tlsRootCertFiles "$ORG2_TLS_ROOT" \
            --waitForEvent \
            --waitForEventTimeout 30s \
            -c '{"function":"TransferAsset","Args":["ASSET-001","Org2 Integration Desk","Org2MSP"]}'

          asset="$(peer chaincode query \
            -C mychannel \
            -n "$CHAINCODE_NAME" \
            -c '{"function":"ReadAsset","Args":["ASSET-001"]}')"
          test "$(printf '%s' "$asset" | jq -r .ownerMsp)" = "Org2MSP"
          test "$(printf '%s' "$asset" | jq -r .owner)" = "Org2 Integration Desk"

          echo "Testing authorized Org2MSP -> Org1MSP ownership transfer..."
          export CORE_PEER_LOCALMSPID=Org2MSP
          export CORE_PEER_TLS_ROOTCERT_FILE="$ORG2_TLS_ROOT"
          export CORE_PEER_MSPCONFIGPATH="$PWD/organizations/peerOrganizations/org2.example.com/users/Admin@org2.example.com/msp"
          export CORE_PEER_ADDRESS=localhost:9051

          peer chaincode invoke \
            -o localhost:7050 \
            --ordererTLSHostnameOverride orderer.example.com \
            --tls \
            --cafile "$ORDERER_TLS_ROOT" \
            -C mychannel \
            -n "$CHAINCODE_NAME" \
            --peerAddresses localhost:7051 \
            --tlsRootCertFiles "$ORG1_TLS_ROOT" \
            --peerAddresses localhost:9051 \
            --tlsRootCertFiles "$ORG2_TLS_ROOT" \
            --waitForEvent \
            --waitForEventTimeout 30s \
            -c '{"function":"TransferAsset","Args":["ASSET-001","Org1 Integration Desk","Org1MSP"]}'

          asset="$(peer chaincode query \
            -C mychannel \
            -n "$CHAINCODE_NAME" \
            -c '{"function":"ReadAsset","Args":["ASSET-001"]}')"
          test "$(printf '%s' "$asset" | jq -r .ownerMsp)" = "Org1MSP"
          test "$(printf '%s' "$asset" | jq -r .owner)" = "Org1 Integration Desk"

  build-push:
    name: Publish and update GitOps
    if: github.event_name != 'pull_request'
    needs: [verify, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: main

      - uses: docker/setup-qemu-action@v3.6.0

      - uses: docker/setup-buildx-action@v3.10.0

      - uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push chaincode image
        uses: docker/build-push-action@v5.4.0
        with:
          context: 04_blockchain/fabric/chaincode
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Patch chaincode deployment manifest
        run: |
          sed -i "s|image: ${{ env.IMAGE }}:.*|image: ${{ env.IMAGE }}:${{ github.sha }}|" \
            02_gitops/fabric/chaincode/deployment.yaml

      - name: Commit manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 02_gitops/fabric/chaincode/deployment.yaml
          git diff --cached --quiet || git commit -m "ci: update chaincode image to ${{ github.sha }}"
          git pull --rebase origin main
          git push origin main
