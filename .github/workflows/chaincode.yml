name: Build & Push Fabric Chaincode

on:
  push:
    branches: [main]
    paths:
      - "04_blockchain/fabric/chaincode/**"
      - ".github/workflows/chaincode.yml"

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Load versions
        run: grep -v '^#' versions.env | grep -v '^$' >> $GITHUB_ENV

      - uses: docker/setup-qemu-action@v3.6.0

      - uses: docker/setup-buildx-action@v3.10.0

      - uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push chaincode image
        uses: docker/build-push-action@v7.1.0
        with:
          context: 04_blockchain/fabric/chaincode
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/samerhijazi/shalm-chaincode:${{ github.sha }}
            ghcr.io/samerhijazi/shalm-chaincode:latest

      - name: Patch chaincode deployment manifest
        run: |
          sed -i "s|image: ghcr.io/samerhijazi/shalm-chaincode:.*|image: ghcr.io/samerhijazi/shalm-chaincode:${{ github.sha }}|" \
            02_gitops/fabric/chaincode/deployment.yaml

      - name: Commit manifest update
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 02_gitops/fabric/chaincode/deployment.yaml
          git diff --cached --quiet || git commit -m "ci: update chaincode image to ${{ github.sha }}"
          git pull --rebase origin main
          git push origin main
