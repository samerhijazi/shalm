name: quarkus-api CI

on:
  push:
    branches: [main]
    paths:
      - "03_apps/quarkus-api/**"
      - ".github/workflows/quarkus-api.yml"
      - "versions.env"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/samerhijazi/quarkus-api
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Load versions
        run: grep -v '^#' versions.env | grep -v '^$' >> $GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@v4.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build with Maven
        run: mvn package -DskipTests
        working-directory: 03_apps/quarkus-api

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (amd64 + arm64)
        uses: docker/build-push-action@v7.1.0
        with:
          context: 03_apps/quarkus-api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Patch deployment manifest
        run: |
          sed -i "s|image: ${{ env.IMAGE }}:.*|image: ${{ env.IMAGE }}:${{ github.sha }}|" \
            02_gitops/quarkus-app/deployment.yaml

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 02_gitops/quarkus-app/deployment.yaml
          git commit -m "ci: update quarkus-api image to ${{ github.sha }}"
          git pull --rebase origin main
          git push origin main
