vmType: "vz"

user:
  name: ubuntu
  home: /home/ubuntu

provision:
  - mode: system
    script: |
      hostnamectl set-hostname test
      mkdir -p /home/ubuntu/.ssh
      chmod 700 /home/ubuntu/.ssh
      echo "ssh-rsa  samerhijazi@SH-MacBook.local" >> /home/ubuntu/.ssh/authorized_keys
      chmod 600 /home/ubuntu/.ssh/authorized_keys
      chown -R ubuntu:ubuntu /home/ubuntu/.ssh

images:
  - location: "./ubuntu-24.04.img"
    arch: "aarch64"

cpus: 1
memory: "1GiB"
disk: "5GiB"

networks:
  - lima: shared

containerd:
  system: false
  user: false
